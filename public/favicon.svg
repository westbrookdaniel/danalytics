<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- danalytics mark: a rising frontier through four points on a rounded tile. -->
  <style>
    .tile { fill: #1c1a18; }
    .ink { fill: #fbfaf8; stroke: #fbfaf8; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f3f1ef; }
      .ink { fill: #1c1a18; stroke: #1c1a18; }
    }
  </style>
  <rect class="tile" x="1" y="1" width="22" height="22" rx="6" />
  <polyline class="ink" points="6,16.5 10,11.5 13.5,13.5 18,7" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle class="ink" cx="6" cy="16.5" r="1.7" stroke="none" />
  <circle class="ink" cx="10" cy="11.5" r="1.7" stroke="none" />
  <circle class="ink" cx="13.5" cy="13.5" r="1.7" stroke="none" />
  <circle class="ink" cx="18" cy="7" r="2.1" stroke="none" />
</svg>
